{
"Dhcp4": {
    "reservations-global": true,
    "echo-client-id": false,
    "store-extended-info": true,
    "interfaces-config": {
        "interfaces": [ "*" ],
        "dhcp-socket-type": "raw"
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/var/run/kea/kea-dhcp4-ctrl.sock"
    },
    
    // Base de datos de Leases (arrendamientos activos en tiempo real)
    "lease-database": {
        "type": "postgresql",
        "name": "dhcp",
        "user": "postgres",
        "password": "P0stgr3s",
        "host": "127.0.0.1",
        "port": 5432
    },
    
    // Base de datos de Reservas de Host (estáticos, inyectados por nuestro trigger)
    "hosts-databases": [
        {
            "type": "postgresql",
            "name": "dhcp",
            "user": "postgres",
            "password": "P0stgr3s",
            "host": "127.0.0.1",
            "port": 5432
        }
    ],
    
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600,
        "max-reclaim-leases": 100,
        "max-reclaim-time": 250,
        "unwarned-reclaim-cycles": 5
    },
    
    // Opciones globales entregadas a todos los dispositivos
    "option-data": [
        {
            "name": "domain-name-servers",
            "data": "8.8.8.8, 8.8.4.4"
        },
        {
            "name": "domain-name",
            "data": "mmelectronica.com"
        }
    ],
    
    "client-classes": [
        {
            "name": "docsis_modems",
            "test": "substring(option[60].hex, 0, 6) == 0x646f63736973 or substring(option[60].hex, 0, 6) == 0x444f43534953"
        },
        {
            "name": "dhcp-cpe-nat",
            "test": "member('KNOWN') and not member('docsis_modems')"
        },
        {
            "name": "cpe-fijas-publicas"
        }
    ],
    
    // Declaración física de Subredes y Pools Dinámicos por Clase
    "subnet4": [
        {
            "id": 1,
            "subnet": "10.200.60.0/22",
            "next-server": "192.168.2.106",
            "server-hostname": "192.168.2.106",
            "pools": [
                {
                    "pool": "10.200.60.2 - 10.200.63.254",
                    "client-class": "KNOWN"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "10.200.60.1"
                },
                {
                    "name": "time-servers",
                    "data": "192.168.2.106",
                    "always-send": true
                },
                {
                    "name": "time-offset",
                    "data": "-10800",
                    "always-send": true
                },
                {
                    "name": "log-servers",
                    "data": "0.0.0.0",
                    "always-send": true
                }
            ]
        }
    ],

    "shared-networks": [
        {
            "name": "cpe-shared-network",
            "subnet4": [
                {
                    "id": 2,
                    "subnet": "172.250.2.0/23",
                    "pools": [
                        {
                            "pool": "172.250.2.2 - 172.250.3.254",
                            "client-class": "dhcp-cpe-nat"
                        }
                    ],
                    "option-data": [
                        {
                            "name": "routers",
                            "data": "172.250.2.1"
                        }
                    ]
                },
                {
                    "id": 4,
                    "subnet": "190.106.80.8/29",
                    "pools": [
                        {
                            "pool": "190.106.80.10 - 190.106.80.14",
                            "client-class": "cpe-fijas-publicas"
                        }
                    ],
                    "option-data": [
                        {
                            "name": "routers",
                            "data": "190.106.80.9"
                        }
                    ]
                }
            ]
        }
    ],
    
    "hooks-libraries": [
        {
            "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_flex_id.so",
            "parameters": {
                "identifier-expression": "relay4[2].hex"
            }
        },
        {
            "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so"
        }
    ],

    "host-reservation-identifiers": [
        "hw-address",
        "flex-id"
    ],
    
    // Configuración de Logging para producción (salida por consola stdout)
    "loggers": [
        {
            "name": "*",
            "output_options": [
                {
                    "output": "stdout",
                    "pattern": "%-5p %D [%t] %m\n"
                }
            ],
            "severity": "INFO"
        },
        {
            "name": "kea-dhcp4.commands",
            "output_options": [
                {
                    "output": "stdout",
                    "pattern": "%-5p %D [%t] %m\n"
                }
            ],
            "severity": "WARN"
        }
    ]
}
}
