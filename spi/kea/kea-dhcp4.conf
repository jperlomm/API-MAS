{
  "Dhcp4": {
    "reservations-global": true,
    "early-global-reservations-lookup": true,
    "reservations-lookup-first": true,
    "match-client-id": false,
    "echo-client-id": false,
    "store-extended-info": true,
    "interfaces-config": {
      "interfaces": [
        "*"
      ],
      "dhcp-socket-type": "raw"
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/kea-dhcp4-ctrl.sock"
    },
    "lease-database": {
      "type": "postgresql",
      "name": "dhcp",
      "user": "postgres",
      "password": "P0stgr3s",
      "host": "127.0.0.1",
      "port": 5432
    },
    "hosts-databases": [
      {
        "type": "postgresql",
        "name": "dhcp",
        "user": "postgres",
        "password": "P0stgr3s",
        "host": "127.0.0.1",
        "port": 5432
      }
    ],
    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "unwarned-reclaim-cycles": 5
    },
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "8.8.8.8, 8.8.4.4"
      },
      {
        "name": "domain-name",
        "data": "mmelectronica.com"
      }
    ],
    "client-classes": [
      {
        "name": "docsis_modems",
        "test": "substring(option[60].hex, 0, 12) == 0x646f63736973 or substring(option[60].hex, 0, 12) == 0x444f43534953 or substring(option[60].text, 0, 6) == 'docsis' or substring(option[60].text, 0, 6) == 'DOCSIS'"
      },
      {
        "name": "cpe.dhcp.nat",
        "test": "member('KNOWN') and not member('docsis_modems')"
      },
      {
        "name": "cpe-fijas-publicas"
      }
    ],
    "subnet4": [],
    "shared-networks": [
      {
        "name": "shared-bundle1-cm",
        "relay": {
          "ip-addresses": [
            "10.200.60.1"
          ]
        },
