{
"Control-agent": {
    "http-host": "0.0.0.0",
    "http-port": 8001,
    "control-sockets": {
        "dhcp4": {
            "socket-type": "unix",
            "socket-name": "/var/run/kea/kea-dhcp4-ctrl.sock"
        }
    },
    "loggers": [
        {
            "name": "kea-ctrl-agent",
            "output_options": [
                {
                    "output": "stdout",
                    "pattern": "%-5p %D [%t] %m\n"
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
