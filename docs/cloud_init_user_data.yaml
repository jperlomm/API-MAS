#cloud-config
# =============================================================================
# SPI MAS - PLANTILLA CLOUD-INIT (USER-DATA) PARA PROXMOX VE
# =============================================================================
# Este archivo automatiza la creación de usuarios, la inyección de llaves SSH,
# la actualización del SO y la instalación de Docker Engine + Compose v2
# utilizando EXACTAMENTE tu flujo y comandos secuenciales.
# =============================================================================

# --- 1. CONFIGURACIÓN DE USUARIOS ---
users:
  - name: usuario
    gecos: Usuario SPI
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    # Puedes colocar tu llave SSH pública de desarrollo aquí para entrar sin contraseña:
    ssh_authorized_keys:
      - ssh-rsa TU_CLAVE_PUBLICA_SSH_AQUÍ

# --- 2. CONFIGURACIÓN DEL AGENTE Y SERVICIOS ---
# Actualizar el sistema de paquetes al primer arranque
package_update: true
package_upgrade: true

# --- 3. INSTALACIÓN DE PAQUETES NATIVOS DE DEBIAN (APT) ---
packages:
  - curl
  - rsync
  - htop
  - git
  - ca-certificates
  - gnupg
  - lsb-release       # Requerido para que funcione tu comando "lsb_release -cs"
  - qemu-guest-agent  # Crucial para que Proxmox vea el estado e IP de la VM

# --- 4. COMANDOS DE ARRANQUE (TU FLUJO SECUENCIAL DE DOCKER) ---
runcmd:
  # Crear carpetas de montaje físicas para discos SCSI
  - mkdir -p /backups
  - mkdir -p /var/lib/docker

  # [Paso 2.1 de tu flujo] Crear la carpeta para las llaves de seguridad
  - install -m 0755 -d /etc/apt/keyrings

  # [Paso 2.2 de tu flujo] Descargar la llave GPG oficial de Docker
  - curl -fsSL https://download.download.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg

  # [Paso 2.3 de tu flujo] Configurar el repositorio estable (Usa tu comando exacto con lsb_release)
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

  # [Paso 3 de tu flujo] Actualizar repositorios e instalar Docker y Docker Compose
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # [Verificación de tu flujo] Habilitar e iniciar Docker en el arranque del sistema
  - systemctl enable --now docker

  # [Paso 4 de tu flujo] Configurar tu usuario administrativo en el grupo de Docker
  - usermod -aG docker usuario

  # Mensaje de finalización en logs
  - echo "========================================================="
  - echo "🎉 INSTALACIÓN PERSONALIZADA DE DOCKER COMPLETADA 🎉"
  - echo "========================================================="
