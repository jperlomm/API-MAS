# =============================================================================
# DEBIAN 12 (BOOKWORM) UNATTENDED PRESEED CONFIGURATION (SPI MAS SPEC)
# =============================================================================
# Este archivo automatiza al 100% la instalación de Debian desde la ISO oficial,
# particionando el disco con LVM e instalando Docker y SSH de forma automática.
# =============================================================================

# --- 1. LOCALIZACIÓN E IDIOMA ---
d-i debian-installer/locale string es_AR.UTF-8
d-i keyboard-configuration/xkb-keymap select es

# --- 2. CONFIGURACIÓN DE RED ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string spi-server
d-i netcfg/get_domain string local
d-i netcfg/wireless_wext string dlink

# --- 3. ESPEJOS DE REPOSITORIOS (MIRRORS) ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- 4. CONFIGURACIÓN DE USUARIOS ---
# Contraseña de Root (Deshabilitada por seguridad para forzar uso de Sudo)
d-i passwd/root-login boolean false

# Crear cuenta de usuario administrativo 'usuario'
d-i passwd/user-fullname string Usuario SPI
d-i passwd/username string usuario
# Contraseña: 'spi_admin_pwd_123' (Casteada a hash MD5/SHA)
d-i passwd/user-password password spi_admin_pwd_123
d-i passwd/user-password-again password spi_admin_pwd_123

# --- 5. RELOJ Y ZONA HORARIA ---
d-i clock-setup/utc boolean true
d-i time/zone string America/Buenos_Aires
d-i clock-setup/ntp boolean true

# --- 6. PARTICIONAMIENTO AVANZADO LVM (ESPECIFICACIÓN SRE) ---
# Forzar particionamiento automático mediante recetas LVM
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Definir el grupo de volumen principal (Volume Group)
d-i partman-auto-lvm/new_vg_name string vg_system

# Receta de particionamiento experto con LVM aislado para proteger producción
d-i partman-auto/expert_recipe string                         \
      boot-root ::                                            \
              1024 1024 1024 ext4                             \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /boot }                     \
              .                                               \
              15000 15000 15000 ext4                          \
                      $lvmok{ }                               \
                      in_vg{ vg_system }                      \
                      lv_name{ lv_root }                      \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .                                               \
              2048 2048 4096 linux-swap                       \
                      $lvmok{ }                               \
                      in_vg{ vg_system }                      \
                      lv_name{ lv_swap }                      \
                      method{ keep }                          \
              .                                               \
              15000 15000 15000 ext4                          \
                      $lvmok{ }                               \
                      in_vg{ vg_system }                      \
                      lv_name{ lv_var_log }                   \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /var/log }                  \
              .                                               \
              20000 20000 20000 ext4                          \
                      $lvmok{ }                               \
                      in_vg{ vg_system }                      \
                      lv_name{ lv_backups }                   \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /backups }                  \
              .                                               \
              40000 40000 -1 ext4                             \
                      $lvmok{ }                               \
                      in_vg{ vg_system }                      \
                      lv_name{ lv_var_lib }                   \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /var/lib/docker }           \
              .

# Confirmar cambios de forma desatendida sin pedir aprobación interactiva
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- 7. SELECCIÓN E INSTALACIÓN DE PAQUETES ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl rsync htop git gnupg2 pass
d-i pkgsel/upgrade select safe-upgrade

# --- 8. CARGADOR DE ARRANQUE (GRUB) ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- 9. SCRIPTS POST-INSTALACIÓN (INSTALAR DOCKER AUTOMÁTICAMENTE) ---
# Ejecutar comandos personalizados al finalizar la instalación antes del reinicio
d-i preseed/late_command string in-target bash -c " \
    apt-get update && \
    apt-get install -y ca-certificates curl gnupg && \
    install -m 0755 -d /etc/apt/keyrings && \
    curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
    chmod a+r /etc/apt/keyrings/docker.gpg && \
    echo 'deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable' > /etc/apt/sources.list.d/docker.list && \
    apt-get update && \
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin && \
    usermod -aG docker usuario && \
    echo 'usuario ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/usuario && \
    chmod 0440 /etc/sudoers.d/usuario"

# --- 10. FINALIZAR INSTALACIÓN Y REINICIAR ---
d-i finish-install/reboot_in_progress note
